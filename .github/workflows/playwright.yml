name: Playwright Tests

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

env:
  CI: true
  BUILD_FOLDER: ./HW22

jobs:
  # ---------------------------------------------------------------------------
  # Run Playwright tests (sharded)
  # ---------------------------------------------------------------------------
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      # --- Setup ---
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_FOLDER }}
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ${{ env.BUILD_FOLDER }}

      # --- Run tests ---
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: ${{ env.BUILD_FOLDER }}

      # --- Publish raw results for the merge job ---
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: ${{ env.BUILD_FOLDER }}/blob-report/
          retention-days: 1
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: ${{ env.BUILD_FOLDER }}/allure-results/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge shard reports into a single HTML/Allure report and publish it
  # ---------------------------------------------------------------------------
  merge-reports:
    if: ${{ !cancelled() }}
    needs: [ test ]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # --- Setup ---
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_FOLDER }}

      # --- Collect shard results ---
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.BUILD_FOLDER }}/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.BUILD_FOLDER }}/all-allure-results
          pattern: allure-results-*
          merge-multiple: true

      # --- Merge & publish HTML report ---
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: ${{ env.BUILD_FOLDER }}
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.BUILD_FOLDER }}/playwright-report/
          retention-days: 30

      # --- Merge & publish Allure report ---
      - name: Merge into JSON report
        run: npx playwright merge-reports --reporter json ./all-blob-reports > test-results.json
        working-directory: ${{ env.BUILD_FOLDER }}
      - name: Generate Allure report
        run: npx allure generate ./all-allure-results --clean -o allure-report
        working-directory: ${{ env.BUILD_FOLDER }}
      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ${{ env.BUILD_FOLDER }}/allure-report/
          retention-days: 30

      # --- Notify ---
      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: daun/playwright-report-summary@v4
        with:
          report-file: ${{ env.BUILD_FOLDER }}/test-results.json
